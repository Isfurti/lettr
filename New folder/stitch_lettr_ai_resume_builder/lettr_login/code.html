<script>
        // Simple interactivity for inputs
        const inputs = document.querySelectorAll('.editorial-input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').style.color = '#041632';
            });
            input.addEventListener('blur', () => {
                if(!input.value) {
                    input.parentElement.querySelector('label').style.color = '';
                }
            });
        });

        // Subtle parallax mouse move effect for the background blur
        document.addEventListener('mousemove', (e) => {
            const decor = document.querySelector('.absolute.top-1/2');
            if(decor) {
                const x = (e.clientX - window.innerWidth / 2) * 0.05;
                const y = (e.clientY - window.innerHeight / 2) * 0.05;
                decor.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            }
        });
    </script>
