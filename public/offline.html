<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline | Lettr</title>
<meta name="theme-color" content="#041632">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fffdf8; color: #041632;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
  .mark { width: 64px; height: 64px; border-radius: 18px; background: #041632; color: #ffc94d; display: inline-flex; align-items: center;
    justify-content: center; font-weight: 800; font-size: 36px; transform: rotate(-6deg); }
  h1 { font-size: 28px; margin: 20px 0 8px; }
  p { color: #4B5563; max-width: 360px; margin: 0 auto 24px; line-height: 1.5; }
  button { min-height: 48px; padding: 0 24px; border-radius: 999px; border: 0; background: #2F5BEA; color: #fff; font-size: 16px; font-weight: 700; }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">L</div>
    <h1>You're offline</h1>
    <p>Lettr needs the internet to load your resumes. Your saved work is safe. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
